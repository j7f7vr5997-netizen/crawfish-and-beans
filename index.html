<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crawfish & Beans">
<meta name="theme-color" content="#0a0606">
<title>CRAWFISH &amp; BEANS — Bean Me Up Crawfish</title>
<style>
  :root{ --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px);
         --sr:env(safe-area-inset-right,0px); --st:env(safe-area-inset-top,0px); }
  *{ box-sizing:border-box; }
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    position:fixed;inset:0;overflow:hidden;background:#0a0606;
    font-family:"Courier New",monospace;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;
  }
  canvas{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;display:block;
    image-rendering:pixelated;image-rendering:crisp-edges;
    background:#0a0606;touch-action:none;
  }
  /* ---------- touch controls (overlay) ---------- */
  #ui{ position:absolute;inset:0;z-index:5;pointer-events:none; }
  .btn{
    position:absolute;pointer-events:auto;
    display:flex;align-items:center;justify-content:center;
    font-family:"Courier New",monospace;font-weight:bold;color:#fff;
    background:rgba(20,12,10,0.40);border:2px solid rgba(255,150,90,0.45);
    border-radius:15px;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    user-select:none;touch-action:none;transition:background .05s,transform .05s;
  }
  .btn.held{ background:rgba(255,140,40,0.6);transform:scale(0.92);border-color:#ffd000; }
  #dpad{ position:absolute;left:calc(14px + var(--sl));bottom:calc(18px + var(--sb));
         width:184px;height:184px;pointer-events:none; }
  #dpad .btn{ width:60px;height:60px;font-size:24px; }
  #b-up{ left:62px;top:0; } #b-left{ left:0;top:62px; }
  #b-right{ left:124px;top:62px; } #b-down{ left:62px;top:124px; }
  #b-jump{ right:calc(20px + var(--sr));bottom:calc(40px + var(--sb));
           width:108px;height:108px;border-radius:50%;font-size:21px;flex-direction:column;line-height:1;
           background:rgba(48,150,76,0.5);border-color:rgba(130,255,170,0.65); }
  #b-jump small{ font-size:10px;font-weight:normal;opacity:.85;margin-top:2px; }
  #b-mute{ width:42px;height:42px;font-size:18px;border-radius:11px;
           top:calc(10px + var(--st));right:calc(10px + var(--sr)); }
  #dpad,#b-jump{ opacity:0;transition:opacity .25s; }
  #dpad .btn,#b-jump{ pointer-events:none; }
  body.playing #dpad,body.playing #b-jump{ opacity:1; }
  body.playing #dpad .btn,body.playing #b-jump{ pointer-events:auto; }
  #tap{ position:absolute;inset:0;z-index:6;display:none;pointer-events:auto;background:transparent; }
  body.showtap #tap{ display:block; }
  #hint{ position:absolute;left:0;right:0;bottom:6px;text-align:center;
         color:#6b4a3a;font-size:12px;letter-spacing:1px;z-index:4;pointer-events:none; }
  /* desktop: keyboard + mouse, hide thumb controls; touch/small: show them, hide hint */
  @media (hover:none),(pointer:coarse),(max-width:760px){ #hint{ display:none; } }
  @media (hover:hover) and (pointer:fine) and (min-width:761px){ #dpad,#b-jump,#b-mute{ display:none; } }
  .glow{color:#ffb000;}
</style>
</head>
<body>
  <canvas id="game" width="448" height="560"></canvas>
  <div id="ui">
    <div id="dpad">
      <div class="btn" id="b-up"    data-k="arrowup">▲</div>
      <div class="btn" id="b-left"  data-k="arrowleft">◀</div>
      <div class="btn" id="b-right" data-k="arrowright">▶</div>
      <div class="btn" id="b-down"  data-k="arrowdown">▼</div>
    </div>
    <div class="btn" id="b-jump" data-k=" ">JUMP<small>hard hat</small></div>
    <div class="btn" id="b-mute">🔊</div>
    <div id="tap"></div>
  </div>
  <div id="hint">◀ ▶ move &nbsp;·&nbsp; ▲ ▼ climb &nbsp;·&nbsp; <span class="glow">SPACE</span> jump &nbsp;·&nbsp; <span class="glow">ENTER</span> start &nbsp;·&nbsp; <span class="glow">M</span> mute</div>
<script>
"use strict";
/* =========================================================================
   CRAWFISH & BEANS  —  "Bean Me Up Crawfish"
   A from-scratch arcade climber. Single file. No dependencies.
   ========================================================================= */

const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;
ctx.imageSmoothingEnabled = false;

/* ---- scaling is pure CSS now: the 448×560 board letterboxes into any phone
   via `object-fit:contain`, so it just works in portrait on every iPhone. ---- */
const IS_TOUCH = (window.matchMedia &&
  matchMedia("(hover:none),(pointer:coarse)").matches) || ("ontouchstart" in window);

/* =========================================================================
   AUDIO  — tiny WebAudio blip synth
   ========================================================================= */
let AC=null, muted=false;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(freq, dur, type, vol, slideTo){
  if(muted) return; const a=ac(); if(!a) return;
  const t=a.currentTime;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||"square"; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime((vol||0.15),t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.02);
}
const SFX = {
  jump:   ()=>beep(420,.16,"square",.14,760),
  land:   ()=>beep(180,.05,"square",.08),
  score:  ()=>beep(880,.08,"square",.12,1320),
  climb:  ()=>beep(240,.04,"square",.05),
  grab:   ()=>{beep(660,.08,"square",.14);setTimeout(()=>beep(990,.12,"square",.14),70);},
  smash:  ()=>beep(150,.12,"sawtooth",.18,60),
  die:    ()=>{beep(400,.18,"sawtooth",.2,80);setTimeout(()=>beep(120,.4,"sawtooth",.2,40),140);},
  throw:  ()=>beep(300,.08,"square",.07,180),
  win:    ()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16,"square",.16),i*120));},
  start:  ()=>{[392,523,659].forEach((f,i)=>setTimeout(()=>beep(f,.14,"square",.16),i*90));},
  gameover:()=>{[330,294,247,196].forEach((f,i)=>setTimeout(()=>beep(f,.22,"sawtooth",.18),i*180));},
};

/* =========================================================================
   INPUT
   ========================================================================= */
const keys={};
const DOWNED={};
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
  if(!keys[k]) DOWNED[k]=true;     // edge
  keys[k]=true;
  if(k==="m"){ muted=!muted; }
  if(k==="enter") onEnter();
  if(k==="r") onR();
  if(!AC) ac(); // unlock audio on first key
});
addEventListener("keydown",()=>{ if(AC&&AC.state==="suspended") AC.resume(); });
addEventListener("keyup",e=>{ keys[e.key.toLowerCase()]=false; });
function pressed(...names){ return names.some(n=>keys[n]); }
function tapped(name){ if(DOWNED[name]){ DOWNED[name]=false; return true;} return false; }
function clearTaps(){ for(const k in DOWNED) DOWNED[k]=false; }

/* ---- touch controls (iPhone) — pointer events support real multi-touch
        so you can hold a direction and tap JUMP at the same time ---- */
function unlockAudio(){
  const a=ac(); if(!a) return;
  if(a.state==="suspended") a.resume();
  if(!unlockAudio._done){ unlockAudio._done=true;
    try{ const b=a.createBuffer(1,1,22050),s=a.createBufferSource(); s.buffer=b; s.connect(a.destination); s.start(0); }catch(e){}
  }
}
function bindButton(el){
  if(!el) return;
  const key=el.getAttribute("data-k");
  const press=e=>{ e.preventDefault(); unlockAudio();
    if(key!==null){ keys[key]=true; if(key===" ") DOWNED[" "]=true; }
    el.classList.add("held");
  };
  const release=e=>{ if(e) e.preventDefault();
    if(key!==null) keys[key]=false; el.classList.remove("held");
  };
  el.addEventListener("pointerdown",press);
  el.addEventListener("pointerup",release);
  el.addEventListener("pointercancel",release);
  el.addEventListener("pointerleave",release);
  el.addEventListener("contextmenu",e=>e.preventDefault());
}
["b-up","b-down","b-left","b-right","b-jump"].forEach(id=>bindButton(document.getElementById(id)));
const muteBtn=document.getElementById("b-mute");
if(muteBtn) muteBtn.addEventListener("pointerdown",e=>{ e.preventDefault(); unlockAudio();
  muted=!muted; muteBtn.textContent=muted?"🔇":"🔊"; });
const tapEl=document.getElementById("tap");
if(tapEl) tapEl.addEventListener("pointerdown",e=>{ e.preventDefault(); unlockAudio();
  if(state==="title") newGame(); else if(state==="gameover") state="title"; });
// kill page-level pinch/scroll/bounce on iOS Safari
document.addEventListener("touchmove",e=>{ e.preventDefault(); },{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault());

/* show thumb controls only while playing; full-screen tap-catcher on menus */
let _uiPhase="";
function syncUI(){
  const p=(state==="title"||state==="gameover")?"showtap":"playing";
  if(p===_uiPhase) return; _uiPhase=p;
  document.body.classList.toggle("playing", p==="playing");
  document.body.classList.toggle("showtap", p==="showtap");
}

/* =========================================================================
   LEVEL GEOMETRY  — zig-zag girders + ladders (classic climber layout)
   Platform indices: 0 = bottom (flat) ... 5 = top (boss girder)
   ========================================================================= */
const XL=24, XR=424;                 // girder horizontal extent
const GT=10;                          // girder thickness
// surface Y at left / right ends, and which end is "low" (where barrels drop)
const PLAT = [
  {yL:500,yR:500, low:null}, // 0 bottom flat
  {yL:424,yR:442, low:'R'},  // 1
  {yL:366,yR:348, low:'L'},  // 2
  {yL:272,yR:290, low:'R'},  // 3
  {yL:214,yR:196, low:'L'},  // 4
  {yL:120,yR:138, low:'R'},  // 5 boss girder
];
function surf(i,x){
  const p=PLAT[i];
  const cx=Math.max(XL,Math.min(XR,x));
  return p.yL + (p.yR-p.yL)*((cx-XL)/(XR-XL));
}
function lowX(i){ const p=PLAT[i]; return p.low==='R'?XR:(p.low==='L'?XL:null); }

// Ladders connect a lower platform to the platform directly above it.
const LADDERS = [
  {x:372, lower:0, upper:1},
  {x:92,  lower:1, upper:2},
  {x:352, lower:2, upper:3},
  {x:92,  lower:3, upper:4},
  {x:300, lower:4, upper:5},
  // a couple of decoy / shortcut partials for flavor (also climbable)
  {x:250, lower:1, upper:2},
  {x:188, lower:3, upper:4},
];
function ladderForUp(p,x){    // ladder whose lower==p near x
  return LADDERS.find(L=>L.lower===p && Math.abs(L.x-x)<11);
}
function ladderForDown(p,x){  // ladder whose upper==p near x
  return LADDERS.find(L=>L.upper===p && Math.abs(L.x-x)<11);
}

/* Captive + boss positions live on top girder (index 5). */
const BOSS_X = 92;            // crawfish stands here, throws beans
const CAPTIVE_X = 300;        // Miss Étouffée — reach her to win

/* =========================================================================
   ENTITIES
   ========================================================================= */
const G = 0.5;               // gravity
function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}

/* ---------- Player ---------- */
const player = {
  x:380, y:surf(0,380), plat:0,
  vx:0, vy:0, w:18, h:24,
  inAir:false, climbing:false, ladder:null,
  face:1, walkT:0, hammer:0, dead:false, deadT:0, win:false, invuln:0,
};
function resetPlayer(){
  player.x=380; player.plat=0; player.y=surf(0,380);
  player.vx=0; player.vy=0; player.inAir=false; player.climbing=false;
  player.ladder=null; player.face=1; player.walkT=0; player.hammer=0;
  player.dead=false; player.deadT=0; player.win=false;
  player.invuln=120;   // ~2s of blinking grace so you can clear the spawn
}

/* ---------- Beans (rolling barrels) ---------- */
let beans=[];
function spawnBean(){
  // born at boss feet on top girder, rolls toward its low end
  const b={
    x:BOSS_X+14, plat:5, y:surf(5,BOSS_X+14),
    vy:0, falling:false, dir:(PLAT[5].low==='R'?1:-1),
    spin:0, jumped:false, wild:Math.random()<0.5,
  };
  beans.push(b);
  SFX.throw();
}
function updateBean(b,dt,speed){
  if(b.falling){
    const prevY=b.y;
    b.vy+=G; b.y+=b.vy;
    // land on first platform surface we cross (any platform, x always in range)
    let best=null;
    for(let i=0;i<PLAT.length;i++){
      const sy=surf(i,b.x);
      if(prevY<=sy && b.y>=sy){ if(best===null || sy<best.sy) best={i,sy}; }
    }
    if(best && best.i!==b.plat){
      b.plat=best.i; b.y=best.sy; b.vy=0; b.falling=false; b.jumped=false;
      const lx=lowX(b.plat);
      b.dir = (b.plat===0) ? -1 : (lx===XR?1:-1);
      SFX.land();
    }
    if(b.y>H+30) b.alive=false;
    return;
  }
  // rolling
  b.x += speed*b.dir;
  b.y = surf(b.plat,b.x);
  b.spin += speed*b.dir*0.12;
  // occasionally tumble down a ladder
  if(b.wild){
    const L=LADDERS.find(L=>L.upper===b.plat && Math.abs(L.x-b.x)<3);
    if(L && Math.random()<0.18){ b.falling=true; b.x=L.x; b.y+=2; return; }
  }
  const lx=lowX(b.plat);
  if(b.plat!==0 && lx!==null){
    if(b.dir>0 && b.x>=XR-2){ b.falling=true; b.x=XR+1; }
    else if(b.dir<0 && b.x<=XL+2){ b.falling=true; b.x=XL-1; }
  } else if(b.plat===0){
    if(b.x< XL-4 || b.x> XR+4){ b.alive=false; } // rolls into the gumbo pot / off edge
  }
}

/* ---------- Cajun Flame (seeker, appears on later levels) ---------- */
let flames=[];
function spawnFlame(){
  flames.push({x:200,plat:0,y:surf(0,200),dir:1,vy:0,falling:false,climb:null,t:0,bob:Math.random()*6});
}
function updateFlame(f,speed){
  f.t++; f.bob+=0.2;
  if(f.climb){
    const L=f.climb;
    const ty=surf(L.upper,L.x), by=surf(L.lower,L.x);
    f.x=L.x;
    if(f.goingUp){ f.y-=speed*0.8; if(f.y<=ty){ f.y=ty; f.plat=L.upper; f.climb=null; } }
    else         { f.y+=speed*0.8; if(f.y>=by){ f.y=by; f.plat=L.lower; f.climb=null; } }
    return;
  }
  f.x+=speed*0.7*f.dir;
  f.y=surf(f.plat,f.x);
  if(f.x<XL+6){ f.x=XL+6; f.dir=1; }
  if(f.x>XR-6){ f.x=XR-6; f.dir=-1; }
  // sometimes take a ladder toward the player's level
  if(f.t%26===0){
    const wantUp = player.plat>f.plat;
    if(wantUp){
      const L=LADDERS.find(L=>L.lower===f.plat && Math.abs(L.x-f.x)<28);
      if(L){ f.climb=L; f.goingUp=true; f.x=L.x; if(Math.random()<0.7) return; }
    } else if(player.plat<f.plat){
      const L=LADDERS.find(L=>L.upper===f.plat && Math.abs(L.x-f.x)<28);
      if(L){ f.climb=L; f.goingUp=false; f.x=L.x; if(Math.random()<0.7) return; }
    }
    // drift toward player horizontally
    if(Math.abs(player.plat-f.plat)<1){ f.dir = player.x>f.x?1:-1; }
  }
}

/* ---------- Hammers ---------- */
let hammers=[];
function placeHammers(){
  hammers=[
    {x:250, plat:2, taken:false},
    {x:250, plat:4, taken:false},
  ];
  hammers.forEach(h=> h.y=surf(h.plat,h.x)-18);
}

/* =========================================================================
   GAME STATE
   ========================================================================= */
let state="title";    // title | play | dying | levelclear | gameover
let score=0, hi=0, lives=3, level=1;
let bonus=5000, bonusT=0;
let spawnTimer=0, spawnEvery=120;
let beanSpeed=1.4;
let stateT=0;         // generic timer for transitions
let boss={armT:0, throwT:0, anger:0};
let stars=[];
for(let i=0;i<70;i++) stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()<.3?2:1,tw:Math.random()*6});

/* ---- the pun mines ---- */
const DEATHPUNS=["BEANED!","SPILLED THE BEANS!","CANNED!","FULL OF BEANS!",
                 "OSHA VIOLATION!","SQUISHED LIKE A MUDBUG!","BEAN THERE, DONE THAT"];
const LEVELPUNS=["Bean there, climbed that!","You're full of beans, Jack!",
                 "Now we're cookin' with beans!","Spilled the beans on that floor!",
                 "Miss Étouffée is saved (for now)!"];
let lastDeathPun="BEANED!";

function startLevel(){
  beans=[]; flames=[];
  placeHammers();
  spawnEvery = Math.max(48, 130 - level*12);
  beanSpeed  = 1.35 + level*0.18;
  bonus = 5000;
  bonusT=0; spawnTimer=40;
  boss.throwT=spawnEvery; boss.armT=0; boss.anger=0;
  resetPlayer();
  // flames on later levels
  const nFlames = level>=3 ? Math.min(2, level-2) : 0;
  for(let i=0;i<nFlames;i++) spawnFlame();
}
function newGame(){
  score=0; lives=3; level=1;
  startLevel(); state="play"; SFX.start(); clearTaps();
}

function onEnter(){
  if(state==="title"){ newGame(); }
}
function onR(){
  if(state==="gameover"){ state="title"; }
}

function loseLife(){
  lives--; SFX.die();
  lastDeathPun = DEATHPUNS[(Math.random()*DEATHPUNS.length)|0];
  player.dead=true; player.deadT=0; state="dying"; stateT=0;
}
function afterDeath(){
  if(lives<=0){ state="gameover"; SFX.gameover(); if(score>hi) hi=score; }
  else {
    beans=[];
    // shoo flames to the far side so they can't camp the spawn point
    flames.forEach((f,i)=>{ f.plat=0; f.x=110+i*46; f.y=surf(0,f.x); f.falling=false; f.climb=null; f.dir=-1; });
    bonus=5000; bonusT=0;          // fresh timer — prevents the bonus<=0 death spiral
    resetPlayer(); state="play";
  }
}
function winLevel(){
  player.win=true; SFX.win(); state="levelclear"; stateT=0;
}
function nextLevel(){
  score += bonus; // award remaining bonus
  level++; startLevel(); state="play";
}

/* =========================================================================
   UPDATE
   ========================================================================= */
function update(){
  stateT++;
  for(const s of stars){ s.tw+=0.05; }

  if(state==="dying"){
    player.deadT++;
    if(player.deadT>90){ afterDeath(); }
    return;
  }
  if(state==="levelclear"){
    if(stateT>150){ nextLevel(); }
    return;
  }
  if(state!=="play") return;

  /* ----- respawn grace ----- */
  if(player.invuln>0) player.invuln--;

  /* ----- bonus countdown ----- */
  bonusT++;
  if(bonusT>=40){ bonusT=0; bonus-=100; if(bonus<=0){ bonus=0; loseLife(); return; } }

  /* ----- boss throws ----- */
  boss.throwT--;
  if(boss.armT>0) boss.armT--;
  if(boss.throwT<=0){
    boss.armT=16; boss.anger=10;
    boss.throwT=spawnEvery + (Math.random()*30-15|0);
    spawnBean();
  }
  if(boss.anger>0) boss.anger--;

  /* ----- player ----- */
  updatePlayer();
  if(state!=="play") return;

  /* ----- beans ----- */
  for(const b of beans){ updateBean(b,1,beanSpeed); }
  // jump-over scoring + collisions
  const pb={x:player.x-9,y:player.y-player.h,w:18,h:player.h};
  for(const b of beans){
    if(b.alive===false) continue;
    const bb={x:b.x-9,y:b.y-16,w:18,h:16};
    // hammer smash
    if(player.hammer>0){
      const reach = player.face>0 ? {x:player.x,y:player.y-22,w:26,h:24} : {x:player.x-26,y:player.y-22,w:26,h:24};
      if(rectsOverlap(reach.x,reach.y,reach.w,reach.h,bb.x,bb.y,bb.w,bb.h)){
        b.alive=false; score+=300; SFX.smash(); addPop(b.x,b.y-10,"300"); continue;
      }
    }
    // jump-over bonus
    if(!b.jumped && !b.falling && player.inAir && player.y < b.y-10 && Math.abs(player.x-b.x)<22){
      b.jumped=true; score+=100; SFX.score(); addPop(b.x,b.y-22,"100");
    }
    // hit
    if(player.invuln<=0 && rectsOverlap(pb.x,pb.y,pb.w,pb.h,bb.x,bb.y,bb.w,bb.h)){
      loseLife(); return;
    }
  }
  beans=beans.filter(b=>b.alive!==false);

  /* ----- flames ----- */
  for(const f of flames){ updateFlame(f,beanSpeed); }
  for(const f of flames){
    const fb={x:f.x-8,y:f.y-18,w:16,h:18};
    if(player.hammer>0){
      const reach = player.face>0 ? {x:player.x,y:player.y-22,w:26,h:24} : {x:player.x-26,y:player.y-22,w:26,h:24};
      if(rectsOverlap(reach.x,reach.y,reach.w,reach.h,fb.x,fb.y,fb.w,fb.h)){
        f.dead=true; score+=500; SFX.smash(); addPop(f.x,f.y-10,"500"); continue;
      }
    }
    if(player.invuln<=0 && rectsOverlap(pb.x,pb.y,pb.w,pb.h,fb.x,fb.y,fb.w,fb.h)){ loseLife(); return; }
  }
  flames=flames.filter(f=>!f.dead);

  /* ----- hammer pickups ----- */
  for(const h of hammers){
    if(h.taken) continue;
    if(player.plat===h.plat && Math.abs(player.x-h.x)<16 && !player.climbing){
      h.taken=true; player.hammer=300; SFX.grab(); addPop(h.x,h.y-6,"DEMO TIME!");
    }
  }
  if(player.hammer>0){ player.hammer--; if(player.hammer===0) player.face=player.face; }

  /* ----- win check ----- */
  if(player.plat===5 && Math.abs(player.x-CAPTIVE_X)<22 && !player.climbing){
    winLevel();
  }

  updatePops();
}

function updatePlayer(){
  const onHammer = player.hammer>0;
  const wantL = pressed("arrowleft","a");
  const wantR = pressed("arrowright","d");
  const wantU = pressed("arrowup","w");
  const wantD = pressed("arrowdown","s");

  /* ----- climbing ----- */
  if(player.climbing){
    const L=player.ladder;
    const ty=surf(L.upper,L.x), by=surf(L.lower,L.x);
    const cs=1.5;
    if(wantU){ player.y-=cs; player.walkT+=0.3; if((stateT&7)===0)SFX.climb(); }
    else if(wantD){ player.y+=cs; player.walkT+=0.3; if((stateT&7)===0)SFX.climb(); }
    if(player.y<=ty){ player.y=ty; player.plat=L.upper; player.climbing=false; player.ladder=null; player.inAir=false; player.vy=0; }
    else if(player.y>=by){ player.y=by; player.plat=L.lower; player.climbing=false; player.ladder=null; player.inAir=false; player.vy=0; }
    // allow stepping off mid-ladder onto nothing? no — keep on ladder.
    // jump off ladder
    if(tapped(" ")){ player.climbing=false; player.ladder=null; player.inAir=true; player.vy=-5; }
    return;
  }

  /* ----- start climbing (not allowed while holding hammer) ----- */
  if(!onHammer && !player.inAir){
    if(wantU){
      const L=ladderForUp(player.plat, player.x);
      if(L){ player.climbing=true; player.ladder=L; player.x=L.x; SFX.climb(); return; }
    }
    if(wantD){
      const L=ladderForDown(player.plat, player.x);
      if(L){ player.climbing=true; player.ladder=L; player.x=L.x; player.y+=2; SFX.climb(); return; }
    }
  }

  /* ----- horizontal ----- */
  const sp = 1.7;
  let mv=0;
  if(wantL){ mv=-1; player.face=-1; }
  else if(wantR){ mv=1; player.face=1; }
  if(mv!==0){ player.x += sp*mv; player.walkT += 0.25; }
  else player.walkT*=0.6;
  player.x = Math.max(XL+6, Math.min(XR-6, player.x));

  /* ----- vertical ----- */
  if(player.inAir){
    const prevY=player.y;
    player.vy+=G; player.y+=player.vy;
    if(player.vy>0){
      let best=null;
      for(let i=0;i<PLAT.length;i++){
        const sy=surf(i,player.x);
        if(prevY<=sy+0.01 && player.y>=sy){ if(best===null||sy<best.sy) best={i,sy}; }
      }
      if(best){ player.y=best.sy; player.plat=best.i; player.inAir=false; player.vy=0; SFX.land(); }
    }
    if(player.y>H+40){ loseLife(); }
  } else {
    // glued to current platform surface
    player.y = surf(player.plat, player.x);
    if(!onHammer && tapped(" ")){ player.inAir=true; player.vy=-7; SFX.jump(); }
  }
}

function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w,h); }

function drawGirder(i){
  const p=PLAT[i];
  // quad from (XL,yL) to (XR,yR), thickness GT downward
  ctx.beginPath();
  ctx.moveTo(XL,p.yL);
  ctx.lineTo(XR,p.yR);
  ctx.lineTo(XR,p.yR+GT);
  ctx.lineTo(XL,p.yL+GT);
  ctx.closePath();
  ctx.fillStyle=C.girder; ctx.fill();
  // top highlight + bottom shadow
  ctx.lineWidth=2; ctx.strokeStyle=C.girderHi;
  ctx.beginPath(); ctx.moveTo(XL,p.yL+1); ctx.lineTo(XR,p.yR+1); ctx.stroke();
  ctx.strokeStyle=C.girderLo;
  ctx.beginPath(); ctx.moveTo(XL,p.yL+GT-1); ctx.lineTo(XR,p.yR+GT-1); ctx.stroke();
  // cross hatch + rivets
  const n=Math.round((XR-XL)/22);
  for(let k=0;k<=n;k++){
    const x=XL+(XR-XL)*k/n;
    const y=surf(i,x);
    ctx.strokeStyle=C.girderLo; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x-5,y+1); ctx.lineTo(x+5,y+GT-1); ctx.stroke();
    px(x-1,y+GT/2-1,2,2,C.rivet);
  }
}

function drawLadder(L){
  const ty=surf(L.upper,L.x), by=surf(L.lower,L.x)+GT-1;
  ctx.strokeStyle=C.ladder; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(L.x-6,ty); ctx.lineTo(L.x-6,by);
  ctx.moveTo(L.x+6,ty); ctx.lineTo(L.x+6,by);
  ctx.stroke();
  ctx.strokeStyle=C.ladderHi; ctx.lineWidth=2;
  for(let y=ty+4;y<by;y+=8){
    ctx.beginPath(); ctx.moveTo(L.x-6,y); ctx.lineTo(L.x+6,y); ctx.stroke();
  }
}

function drawBean(b){
  ctx.save();
  ctx.translate(b.x,b.y-8);
  ctx.rotate(b.spin);
  // kidney-bean body
  ctx.fillStyle=C.bean;
  ctx.beginPath(); ctx.ellipse(0,0,9,7,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=C.beanDk;
  ctx.beginPath(); ctx.ellipse(2,1,9,7,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=C.bean;
  ctx.beginPath(); ctx.ellipse(0,0,8,6,0,0,Math.PI*2); ctx.fill();
  // sauce sheen
  ctx.fillStyle=C.beanHi;
  ctx.beginPath(); ctx.ellipse(-2,-2,3,2,0,0,Math.PI*2); ctx.fill();
  // hilum (the bean's notch)
  ctx.fillStyle=C.beanDk;
  ctx.fillRect(-1,-1,3,2);

function drawPlayer(){
  const p=player;
  // blink while the respawn grace period is active
  if(!p.dead && p.invuln>0 && (Math.floor(stateT/4)%2)===0) return;
  let bobY=0, lean=0;
  ctx.save();
  if(p.dead){
    // spin out
    ctx.translate(p.x,p.y-12);
    ctx.rotate(p.deadT*0.3);
    drawWorker(0,0,p.face,0,true);
    ctx.restore(); return;

  const stepping = Math.sin(p.walkT)*1;
  ctx.translate(p.x, p.y);
  drawWorker(0,0,p.face,p.climbing?0:stepping,false);
  // hammer in hand
  if(p.hammer>0){
    const swing = Math.sin(stateT*0.4);
    ctx.save();
    ctx.translate(p.face*8,-16);
    ctx.rotate(p.face*(swing*0.9-0.4));
    px(-1,-14,2,16,"#7a4a1f");
    px(-6,-20,12,8,"#c9c9d4"); px(-6,-20,12,2,"#fff");
    ctx.restore();
  }
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();

  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* ---------- scene ---------- */
function drawScene(){
  // backdrop
  ctx.fillStyle="#0a0606"; ctx.fillRect(0,0,W,H);
  // stars
  for(const s of stars){
    const a=0.4+0.6*Math.abs(Math.sin(s.tw));
    ctx.fillStyle=`rgba(255,180,120,${a*0.5})`;
    ctx.fillRect(s.x|0,s.y|0,s.s,s.s);
  }
  // ambient glow at top (boss lair)
  const g=ctx.createRadialGradient(BOSS_X,120,10,BOSS_X,120,180);
  g.addColorStop(0,"rgba(255,60,40,0.12)"); g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,260);

  for(const L of LADDERS) drawLadder(L);
  for(let i=0;i<PLAT.length;i++) drawGirder(i);
  drawGumboPot();
  for(const h of hammers) drawHammer(h);
  drawCaptive();
  drawCrawfish();
  for(const b of beans) drawBean(b);
  for(const f of flames) drawFlame(f);
  if(state!=="gameover") drawPlayer();

  // score pops
  ctx.textAlign="center"; ctx.font="bold 11px 'Courier New'";
  for(const p of pops){
    ctx.fillStyle=`rgba(255,255,255,${1-p.t/48})`;
    ctx.fillText(p.txt, p.x, p.y-p.t*0.4);
  }
  ctx.textAlign="left";
}

    ctx.font="bold 16px 'Courier New'";
    ctx.fillStyle="#fff";
    ctx.fillText((IS_TOUCH?"TAP":"PRESS ENTER")+" TO RESCUE MISS ÉTOUFFÉE", W/2, 472);
  }
  ctx.font="11px 'Courier New'";
  ctx.fillStyle="#6b4a3a";
  ctx.fillText("Climb the girders · dodge the beans · grab the sledge", W/2, 500);
  ctx.fillText("HARD HAT REQUIRED · a not-Donkey-Kong jobsite", W/2, 516);

  // fake "Temu" knock-off badge
  ctx.save();
  ctx.translate(72,78); ctx.rotate(-0.2);
  ctx.fillStyle="#ff7a00"; roundRect(-44,-14,88,28,6); ctx.fill();
  ctx.fillStyle="#fff"; ctx.font="bold 11px 'Courier New'"; ctx.textAlign="center";
  ctx.fillText("100% LEGIT", 0,-1); ctx.fillText("ARCADE™", 0,11);
  ctx.restore();
  ctx.textAlign="left";
}

function drawOverlayCenter(lines){
  ctx.fillStyle="rgba(0,0,0,0.72)"; ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  let y=H/2-40;
  for(const ln of lines){
    ctx.font=`bold ${ln.size}px 'Courier New'`;
    ctx.fillStyle=ln.color;
    ctx.fillText(ln.t, W/2, y);
    y+=ln.size+10;
  }
  ctx.textAlign="left";
}

/* =========================================================================
   MAIN LOOP  — fixed timestep
   ========================================================================= */
let acc=0, last=performance.now();
const STEP=1000/60;
function loop(now){
  let dt=now-last; last=now; if(dt>200)dt=200;
  acc+=dt;
  while(acc>=STEP){ update(); acc-=STEP; }
  render();
  requestAnimationFrame(loop);
}
function render(){
  syncUI();
  if(state==="title"){ drawTitle(); return; }
  drawScene();
  drawHUD();
  if(state==="dying"){
    if(stateT>30) drawOverlayCenter([
      {t:lastDeathPun,size:28,color:C.craw},
      {t:lives>0?(lives+" crews left"):"jobsite shut down…",size:14,color:"#fff"},
    ]);
  }
  if(state==="levelclear"){
    drawOverlayCenter([
      {t:"FLOOR COMPLETE!",size:25,color:"#ffd000"},
      {t:LEVELPUNS[level%LEVELPUNS.length],size:13,color:C.captive},
      {t:"BONUS  +"+bonus,size:16,color:"#36d0e0"},
      {t:"...the Crawfather hauls her up a floor!",size:11,color:"#ff7a52"},
    ]);
  }
  if(state==="gameover"){
    drawScene(); // keep board
    drawOverlayCenter([
      {t:"GAME OVER",size:34,color:C.craw},
      {t:"the Crawfather wins this round",size:12,color:"#ff7a52"},
      {t:"FINAL SCORE  "+pad(score,6),size:16,color:"#fff"},
      {t:"HI  "+pad(Math.max(hi,score),6),size:13,color:"#ffd000"},
      {t:((stateT>>5)&1)?(IS_TOUCH?"TAP TO TRY AGAIN":"press R for title"):" ",size:14,color:"#36d0e0"},
      {t:'"bean me up crawfish"',size:12,color:"#6b4a3a"},
    ]);
  }
}
requestAnimationFrame(loop);
